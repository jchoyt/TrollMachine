plugins {
    id 'java'
}

group = 'com.asharpminer'
version = '26.3'

java {
    // Pins which JDK compiles/tests this project, independent of whatever
    // `java` happens to be first on a given machine's PATH.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'spigotmc-repo'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
    maven {
        // Resolves ManHunt (see below) — it isn't published to Maven
        // Central, but JitPack builds arbitrary GitHub repos on demand and
        // serves the result from here.
        name = 'jitpack'
        url = 'https://jitpack.io'
    }
}

dependencies {
    // Provided by the Spigot/Paper server at runtime; never bundled into the
    // plugin jar. Tests need it on their own compile+runtime classpath too,
    // since they run in a plain JVM with no real server providing it.
    compileOnly 'org.spigotmc:spigot-api:26.3-R0.1-SNAPSHOT'
    testCompileOnly 'org.spigotmc:spigot-api:26.3-R0.1-SNAPSHOT'
    testRuntimeOnly 'org.spigotmc:spigot-api:26.3-R0.1-SNAPSHOT'

    // Soft dependency (see plugin.yml's softdepend), used only by
    // ManHuntFailListener. ManHunt (https://github.com/jchoyt/ManHunt)
    // migrated to Gradle but hasn't cut a tagged release since, so this
    // floats on the latest master commit via JitPack rather than pinning to
    // a version — bump to a tag once one exists upstream.
    compileOnly 'com.github.jchoyt:ManHunt:master-SNAPSHOT'
    testCompileOnly 'com.github.jchoyt:ManHunt:master-SNAPSHOT'
    testRuntimeOnly 'com.github.jchoyt:ManHunt:master-SNAPSHOT'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.24.0'
}

tasks.withType(JavaCompile).configureEach {
    // Matches spigot-api 26.2, which itself requires a Java 25+ server JVM.
    options.release = 25
}

test {
    useJUnit()
    // Keeps Mockito's Byte Buddy working on JDKs newer than it officially supports yet.
    jvmArgs '-Dnet.bytebuddy.experimental=true'
}

def pluginVersion = version // captured at configuration time; avoids referencing
                             // `project` from within the task's execution-time closure
processResources {
    filesMatching('plugin.yml') {
        expand(version: pluginVersion)
    }
}

tasks.named('jar') {
    archiveBaseName = 'TrollMachine'
}
